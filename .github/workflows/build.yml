name: Build FluxLauncher

on:
  workflow_dispatch:

  push:
    branches:
      - v3_openjdk

permissions:
  contents: read

jobs:

  build:

    name: Build FluxLauncher APK
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ==========================================
      # JAVA 21
      # ==========================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ==========================================
      # LTW
      # ==========================================

      - name: Download LTW
        run: |
          sudo apt-get update
          sudo apt-get install -y wget python3

          mkdir -p app_pojavlauncher/libs

          wget \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar \
            -O app_pojavlauncher/libs/ltw-release.aar

      # ==========================================
      # FLUXLAUNCHER CUSTOMIZATION
      # ==========================================

      - name: Apply FluxLauncher customization
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path
          import re

          ROOT = Path("app_pojavlauncher")
          MAIN = ROOT / "src" / "main"
          RES = MAIN / "res"
          VALUES = RES / "values"

          VALUES.mkdir(
              parents=True,
              exist_ok=True
          )

          # ==========================================
          # COLORS
          # ==========================================

          PURPLE = "#9C27B0"
          PURPLE_DARK = "#6A1B9A"
          PURPLE_LIGHT = "#CE93D8"

          BACKGROUND = "#120A18"
          SURFACE = "#1E0A29"

          print("")
          print("==========================================")
          print("       FLUXLAUNCHER CUSTOMIZATION")
          print("==========================================")

          # ==========================================
          # 1. APP NAME
          # ==========================================

          strings_files = list(
              RES.rglob("strings.xml")
          )

          for file in strings_files:

              try:
                  text = file.read_text(
                      encoding="utf-8"
                  )
              except Exception:
                  continue

              original = text

              text = re.sub(
                  r'<string\s+name="app_name"[^>]*>.*?</string>',
                  '<string name="app_name">FluxLauncher</string>',
                  text,
                  count=1,
                  flags=re.DOTALL
              )

              text = re.sub(
                  r'<string\s+name="app_short_name"[^>]*>.*?</string>',
                  '<string name="app_short_name">FluxLauncher</string>',
                  text,
                  count=1,
                  flags=re.DOTALL
              )

              if text != original:

                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

          print("[OK] App name: FluxLauncher")

          # ==========================================
          # 2. APPLICATION ID
          # ==========================================
          #
          # Android package ID:
          # com.fluxlauncher.fv
          #
          # APK name is handled separately below:
          # FluxLauncher.apk
          #
          # ==========================================

          gradle_files = list(
              ROOT.rglob("build.gradle")
          )

          for file in gradle_files:

              try:
                  text = file.read_text(
                      encoding="utf-8"
                  )
              except Exception:
                  continue

              original = text

              text = re.sub(
                  r'applicationId\s+["\'][^"\']+["\']',
                  'applicationId "com.fluxlauncher.fv"',
                  text,
                  count=1
              )

              text = re.sub(
                  r'^\s*applicationIdSuffix\s+["\'][^"\']+["\']\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              if text != original:

                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

          print("[OK] Application ID: com.fluxlauncher.fv")

          # ==========================================
          # 3. REPLACE GREEN COLORS
          # ==========================================

          green_colors = [

              "#57CC33",
              "#55CC33",
              "#4CAF50",
              "#4caf50",

              "#00FF00",
              "#00ff00",

              "#32CD32",
              "#32cd32",

              "#33CC33",
              "#33cc33",

              "#3CFF00",
              "#3cff00",

              "#39FF14",
              "#39ff14",

              "#00C853",
              "#00c853",

              "#00E676",
              "#00e676",

              "#76FF03",
              "#76ff03",

              "#64DD17",
              "#64dd17"
          ]

          changed_files = 0
          changed_colors = 0

          for file in RES.rglob("*.xml"):

              try:
                  text = file.read_text(
                      encoding="utf-8"
                  )
              except Exception:
                  continue

              original = text

              for green in green_colors:

                  count = text.lower().count(
                      green.lower()
                  )

                  if count > 0:

                      changed_colors += count

                      text = re.sub(
                          re.escape(green),
                          PURPLE,
                          text,
                          flags=re.IGNORECASE
                      )

              if text != original:

                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

                  changed_files += 1

          print(
              "[OK] Green colors replaced:",
              changed_colors
          )

          print(
              "[OK] XML files changed:",
              changed_files
          )

          # ==========================================
          # 4. FORCE PLAY BUTTON PURPLE
          # ==========================================

          colors_xml = VALUES / "colors.xml"

          if colors_xml.exists():

              text = colors_xml.read_text(
                  encoding="utf-8"
              )

              color_names = [

                  "minebutton_color",
                  "play_button_color",
                  "button_play_color",
                  "button_color",
                  "playbutton_color"
              ]

              for name in color_names:

                  pattern = (
                      r'(<color\s+name=["\']'
                      + re.escape(name)
                      + r'["\']\s*>).*?(</color>)'
                  )

                  text = re.sub(
                      pattern,
                      r'\1' + PURPLE + r'\2',
                      text,
                      flags=re.IGNORECASE | re.DOTALL
                  )

              colors_xml.write_text(
                  text,
                  encoding="utf-8"
              )

          print("[OK] Play button forced to purple")

          # ==========================================
          # 5. CREATE FLUX COLORS
          # ==========================================

          flux_colors = VALUES / "flux_colors.xml"

          flux_colors.write_text(
          """<?xml version="1.0" encoding="utf-8"?>
          <resources>

              <color name="flux_purple">#9C27B0</color>

              <color name="flux_purple_dark">#6A1B9A</color>

              <color name="flux_purple_light">#CE93D8</color>

              <color name="flux_background">#120A18</color>

              <color name="flux_surface">#1E0A29</color>

              <color name="flux_text">#FFFFFF</color>

              <color name="flux_text_secondary">#D8B8E6</color>

          </resources>
          """,
          encoding="utf-8"
          )

          print("[OK] Flux purple colors created")

          # ==========================================
          # 6. DARK PURPLE BACKGROUND
          # ==========================================

          for file in RES.rglob("*.xml"):

              try:
                  text = file.read_text(
                      encoding="utf-8"
                  )
              except Exception:
                  continue

              original = text

              background_names = [

                  "background_app",
                  "background_main",
                  "background_bottom_bar",
                  "background_overlay"

              ]

              for name in background_names:

                  pattern = (
                      r'(<color\s+name=["\']'
                      + re.escape(name)
                      + r'["\']\s*>).*?(</color>)'
                  )

                  text = re.sub(
                      pattern,
                      r'\1' + BACKGROUND + r'\2',
                      text,
                      flags=re.IGNORECASE | re.DOTALL
                  )

              if text != original:

                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

          print("[OK] Dark purple background")

          # ==========================================
          # 7. PURPLE THEME
          # ==========================================

          theme = VALUES / "flux_theme.xml"

          theme.write_text(
          """<?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="FluxTheme" parent="AppTheme">

                  <item name="colorPrimary">@color/flux_purple</item>

                  <item name="colorPrimaryDark">@color/flux_purple_dark</item>

                  <item name="colorAccent">@color/flux_purple_light</item>

                  <item name="android:colorAccent">@color/flux_purple_light</item>

                  <item name="android:windowBackground">@color/flux_background</item>

                  <item name="android:statusBarColor">@color/flux_purple_dark</item>

                  <item name="android:navigationBarColor">@color/flux_background</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          """,
          encoding="utf-8"
          )

          print("[OK] FluxTheme created")

          # ==========================================
          # 8. ENABLE FLUX THEME
          # ==========================================

          manifest = MAIN / "AndroidManifest.xml"

          if manifest.exists():

              text = manifest.read_text(
                  encoding="utf-8"
              )

              text = text.replace(
                  'android:theme="@style/AppTheme"',
                  'android:theme="@style/FluxTheme"'
              )

              manifest.write_text(
                  text,
                  encoding="utf-8"
              )

              print("[OK] FluxTheme enabled")

          else:

              print("[WARNING] AndroidManifest.xml not found")

          # ==========================================
          # 9. HIDE DISCORD XML ELEMENTS
          # ==========================================

          discord_count = [0]

          for file in RES.rglob("*.xml"):

              try:
                  text = file.read_text(
                      encoding="utf-8"
                  )
              except Exception:
                  continue

              original = text

              pattern = re.compile(
                  r'<([A-Za-z0-9_.]+)\b([^>]*(?:discord|Discord|DISCORD)[^>]*)>',
                  re.IGNORECASE
              )

              def hide_discord(match):

                  tag = match.group(1)

                  attrs = match.group(2)

                  if "android:visibility" in attrs:

                      attrs = re.sub(
                          r'android:visibility\s*=\s*"[^"]*"',
                          'android:visibility="gone"',
                          attrs
                      )

                  else:

                      attrs += (
                          ' android:visibility="gone"'
                      )

                  discord_count[0] += 1

                  return (
                      "<"
                      + tag
                      + attrs
                      + ">"
                  )

              text = pattern.sub(
                  hide_discord,
                  text
              )

              if text != original:

                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

          print(
              "[OK] Discord XML elements hidden:",
              discord_count[0]
          )

          # ==========================================
          # 10. REMOVE DISCORD URLS FROM XML
          # ==========================================

          discord_urls = [0]

          for file in RES.rglob("*.xml"):

              try:
                  text = file.read_text(
                      encoding="utf-8"
                  )
              except Exception:
                  continue

              original = text

              def remove_url(match):

                  discord_urls[0] += 1

                  return ""

              text = re.sub(
                  r'https?://(?:www\.)?discord(?:\.gg|\.com)[^"<\s]*',
                  remove_url,
                  text,
                  flags=re.IGNORECASE
              )

              if text != original:

                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

          print(
              "[OK] Discord URLs removed:",
              discord_urls[0]
          )

          # ==========================================
          # 11. HIDE DISCORD SOURCE UI
          # ==========================================

          source_files = [0]

          for extension in [
              "*.java",
              "*.kt"
          ]:

              for file in MAIN.rglob(extension):

                  try:
                      text = file.read_text(
                          encoding="utf-8"
                      )
                  except Exception:
                      continue

                  if re.search(
                      r'discord',
                      text,
                      re.IGNORECASE
                  ):

                      source_files[0] += 1

                      # Remove Discord URLs
                      text = re.sub(
                          r'https?://(?:www\.)?discord(?:\.gg|\.com)[^\s"\']*',
                          "",
                          text,
                          flags=re.IGNORECASE
                      )

                      file.write_text(
                          text,
                          encoding="utf-8"
                      )

          print(
              "[OK] Discord source files processed:",
              source_files[0]
          )

          # ==========================================
          # 12. FINAL REPORT
          # ==========================================

          print("")
          print("==========================================")
          print("          FLUXLAUNCHER READY")
          print("==========================================")
          print("Name:        FluxLauncher")
          print("Package:     com.fluxlauncher.fv")
          print("Theme:       PURPLE")
          print("Play button: PURPLE")
          print("Background:  DARK PURPLE")
          print("Discord:     HIDDEN")
          print("APK:         FluxLauncher.apk")
          print("==========================================")
          print("")

          PY

      # ==========================================
      # GRADLE
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      # ==========================================
      # LANGUAGE LIST
      # ==========================================

      - name: Update language list
        run: |

          chmod +x scripts/languagelist_updater.sh

          ./scripts/languagelist_updater.sh

      # ==========================================
      # BUILD LWJGL
      # ==========================================

      - name: Build LWJGL
        run: |

          ./gradlew \
            :jre_lwjgl3glfw:build \
            --no-daemon

      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # BUILD FLUXLAUNCHER
      # ==========================================

      - name: Build FluxLauncher APK
        run: |

          ./gradlew \
            :app_pojavlauncher:assembleDebug \
            --no-daemon

      # ==========================================
      # FIND APK
      # ==========================================

      - name: Prepare FluxLauncher APK
        shell: bash
        run: |

          mkdir -p out

          APK=$(find \
            app_pojavlauncher/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo ""
            echo "=========================================="
            echo "ERROR: APK NOT FOUND"
            echo "=========================================="

            find \
              app_pojavlauncher/build \
              -type f \
              -name "*.apk" \
              -print

            exit 1

          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          cp \
            "$APK" \
            out/FluxLauncher.apk

          echo ""
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh \
            out/FluxLauncher.apk

      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload FluxLauncher APK
        uses: actions/upload-artifact@v4
        with:
          name: FluxLauncher
          path: out/FluxLauncher.apk
          if-no-files-found: error
