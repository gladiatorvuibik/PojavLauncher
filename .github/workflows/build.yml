name: Build FluxLauncher

on:
  workflow_dispatch:

  push:
    branches:
      - v3_openjdk

permissions:
  contents: read

jobs:

  build:

    name: Build FluxLauncher APK
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ==========================================
      # JAVA 21
      # ==========================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ==========================================
      # LTW
      # ==========================================

      - name: Download LTW
        run: |
          sudo apt-get update
          sudo apt-get install -y wget python3

          mkdir -p app_pojavlauncher/libs

          wget \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar \
            -O app_pojavlauncher/libs/ltw-release.aar

      # ==========================================
      # FLUXLAUNCHER
      # ==========================================

      - name: Apply FluxLauncher customization
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path
          import re

          ROOT = Path("app_pojavlauncher")
          MAIN = ROOT / "src" / "main"
          RES = MAIN / "res"
          VALUES = RES / "values"

          VALUES.mkdir(
              parents=True,
              exist_ok=True
          )

          PURPLE = "#9C27B0"
          PURPLE_DARK = "#6A1B9A"
          PURPLE_LIGHT = "#CE93D8"
          BACKGROUND = "#120A18"

          print("")
          print("======================================")
          print("       FLUXLAUNCHER MODIFICATION")
          print("======================================")

          # ==========================================
          # 1. APP NAME
          # ==========================================

          for file in RES.rglob("strings.xml"):

              try:
                  text = file.read_text(
                      encoding="utf-8"
                  )
              except Exception:
                  continue

              original = text

              text = re.sub(
                  r'<string\s+name="app_name"[^>]*>.*?</string>',
                  '<string name="app_name">FluxLauncher</string>',
                  text,
                  count=1,
                  flags=re.DOTALL
              )

              text = re.sub(
                  r'<string\s+name="app_short_name"[^>]*>.*?</string>',
                  '<string name="app_short_name">FluxLauncher</string>',
                  text,
                  count=1,
                  flags=re.DOTALL
              )

              if text != original:

                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

          print("[OK] App name: FluxLauncher")

          # ==========================================
          # 2. APPLICATION ID
          # ==========================================

          gradle_files = [
              ROOT / "build.gradle",
              ROOT / "build.gradle.kts",
              ROOT / "app" / "build.gradle",
              ROOT / "app" / "build.gradle.kts"
          ]

          gradle_files += list(
              ROOT.glob("*/build.gradle")
          )

          gradle_files += list(
              ROOT.glob("*/build.gradle.kts")
          )

          for file in gradle_files:

              if not file.exists():
                  continue

              try:
                  text = file.read_text(
                      encoding="utf-8"
                  )
              except Exception:
                  continue

              original = text

              text = re.sub(
                  r'applicationId\s+["\'][^"\']+["\']',
                  'applicationId "com.fluxlauncher.fv"',
                  text,
                  count=1
              )

              text = re.sub(
                  r'^\s*applicationIdSuffix\s+["\'][^"\']+["\']\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              if text != original:

                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

                  print(
                      "[OK] Application ID:",
                      file
                  )

                  break

          # ==========================================
          # 3. REMOVE DISCORD FROM MAIN MENU
          # ==========================================
          #
          # НЕ используем регулярные выражения
          # для изменения XML-тегов.
          #
          # Удаляем конкретные оригинальные блоки.
          #
          # ==========================================

          launcher_xml = (
              RES
              / "layout"
              / "fragment_launcher.xml"
          )

          if launcher_xml.exists():

              text = launcher_xml.read_text(
                  encoding="utf-8"
              )

              original = text

              # --------------------------------------
              # Discord button
              # --------------------------------------

              discord_block = """\t\t\t<com.kdt.mcgui.LauncherMenuButton
\t\t\t\tandroid:id="@+id/discord_button"
\t\t\t\tstyle="@style/LauncherMenuButton.Universal"
\t\t\t\tandroid:layout_width="0dp"
\t\t\t\tandroid:text="@string/mcl_button_discord"
\t\t\t\tandroid:drawableStart="@drawable/ic_discord"
\t\t\t\tapp:layout_constraintTop_toTopOf="parent"
\t\t\t\tapp:layout_constraintStart_toEndOf="@id/social_divider"
\t\t\t\tapp:layout_constraintEnd_toEndOf="parent"/>
"""

              if discord_block in text:

                  text = text.replace(
                      discord_block,
                      ""
                  )

                  print(
                      "[OK] Discord button removed"
                  )

              else:

                  # Более универсальный вариант
                  pattern = re.compile(
                      r'\s*<com\.kdt\.mcgui\.LauncherMenuButton\s+'
                      r'android:id="@\+id/discord_button"'
                      r'.*?'
                      r'/>\s*',
                      re.DOTALL
                  )

                  new_text = pattern.sub(
                      "\n",
                      text
                  )

                  if new_text != text:

                      text = new_text

                      print(
                          "[OK] Discord button removed"
                      )

              # --------------------------------------
              # Social divider
              # --------------------------------------

              divider_block = """\t\t\t<View
\t\t\t\tandroid:id="@+id/social_divider"
\t\t\t\tstyle="@style/LauncherFragment_Divider"
\t\t\t\tandroid:layout_marginVertical="@dimen/padding_large"
\t\t\t\tapp:layout_constraintTop_toTopOf="parent"
\t\t\t\tapp:layout_constraintStart_toStartOf="@id/center_guideline"
\t\t\t\tapp:layout_constraintEnd_toEndOf="@id/center_guideline"
\t\t\t\tapp:layout_constraintBottom_toBottomOf="@id/news_button"/>
"""

              if divider_block in text:

                  text = text.replace(
                      divider_block,
                      ""
                  )

                  print(
                      "[OK] Discord divider removed"
                  )

              else:

                  pattern = re.compile(
                      r'\s*<View\s+'
                      r'android:id="@\+id/social_divider"'
                      r'.*?'
                      r'/>\s*',
                      re.DOTALL
                  )

                  text = pattern.sub(
                      "\n",
                      text
                  )

              # --------------------------------------
              # News button becomes full width
              # --------------------------------------

              text = text.replace(
                  'android:layout_width="0dp"\n'
                  '\t\t\t\tandroid:text="@string/mcl_tab_wiki"',
                  'android:layout_width="match_parent"\n'
                  '\t\t\t\tandroid:text="@string/mcl_tab_wiki"'
              )

              text = text.replace(
                  'app:layout_constraintEnd_toStartOf="@id/social_divider"',
                  ''
              )

              text = text.replace(
                  'app:layout_constraintEnd_toEndOf="parent" />',
                  'app:layout_constraintEnd_toEndOf="parent" />'
              )

              launcher_xml.write_text(
                  text,
                  encoding="utf-8"
              )

              print(
                  "[OK] fragment_launcher.xml updated"
              )

          else:

              print(
                  "[WARNING] fragment_launcher.xml not found"
              )

          # ==========================================
          # 4. PURPLE COLORS
          # ==========================================

          flux_colors = VALUES / "flux_colors.xml"

          flux_colors.write_text(
          """<?xml version="1.0" encoding="utf-8"?>
          <resources>

              <color name="flux_purple">#9C27B0</color>
              <color name="flux_purple_dark">#6A1B9A</color>
              <color name="flux_purple_light">#CE93D8</color>

              <color name="flux_background">#120A18</color>

          </resources>
          """,
          encoding="utf-8"
          )

          print("[OK] Purple colors created")

          # ==========================================
          # 5. REPLACE KNOWN GREEN COLORS
          # ==========================================

          green_colors = [
              "#57CC33",
              "#55CC33",
              "#4CAF50",
              "#4caf50",
              "#00FF00",
              "#00ff00",
              "#32CD32",
              "#32cd32",
              "#33CC33",
              "#33cc33",
              "#3CFF00",
              "#3cff00",
              "#39FF14",
              "#39ff14",
              "#00C853",
              "#00c853",
              "#00E676",
              "#00e676",
              "#76FF03",
              "#76ff03",
              "#64DD17",
              "#64dd17"
          ]

          changed = 0

          for file in RES.rglob("*.xml"):

              # strings.xml НЕ ТРОГАЕМ
              if file.name == "strings.xml":
                  continue

              try:
                  text = file.read_text(
                      encoding="utf-8"
                  )
              except Exception:
                  continue

              original = text

              for green in green_colors:

                  if green.lower() in text.lower():

                      text = re.sub(
                          re.escape(green),
                          PURPLE,
                          text,
                          flags=re.IGNORECASE
                      )

                      changed += 1

              if text != original:

                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

          print(
              "[OK] Green -> Purple:",
              changed
          )

          # ==========================================
          # 6. MAIN COLORS.XML
          # ==========================================

          colors_files = list(
              RES.rglob("colors.xml")
          )

          for file in colors_files:

              try:
                  text = file.read_text(
                      encoding="utf-8"
                  )
              except Exception:
                  continue

              original = text

              # Основной цвет кнопки Play
              text = re.sub(
                  r'(<color\s+name="minebutton_color"\s*>).*?(</color>)',
                  r'\1#9C27B0\2',
                  text,
                  flags=re.IGNORECASE | re.DOTALL
              )

              # Фон приложения
              text = re.sub(
                  r'(<color\s+name="background_app"\s*>).*?(</color>)',
                  r'\1#120A18\2',
                  text,
                  flags=re.IGNORECASE | re.DOTALL
              )

              # Нижняя панель
              text = re.sub(
                  r'(<color\s+name="background_bottom_bar"\s*>).*?(</color>)',
                  r'\1#1E0A29\2',
                  text,
                  flags=re.IGNORECASE | re.DOTALL
              )

              if text != original:

                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

                  print(
                      "[OK] Main colors changed:",
                      file
                  )

          # ==========================================
          # 7. PURPLE PLAY BUTTON DRAWABLE
          # ==========================================

          drawable_dir = RES / "drawable"

          drawable_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          play_drawable = (
              drawable_dir
              / "mine_button_background.xml"
          )

          play_drawable.write_text(
          """<?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">

              <item android:state_pressed="true">

                  <shape android:shape="rectangle">

                      <solid android:color="#6A1B9A"/>

                      <corners android:radius="2dp"/>

                  </shape>

              </item>

              <item>

                  <shape android:shape="rectangle">

                      <solid android:color="#9C27B0"/>

                      <corners android:radius="2dp"/>

                  </shape>

              </item>

          </selector>
          """,
          encoding="utf-8"
          )

          print(
              "[OK] Purple Play button drawable created"
          )

          # ==========================================
          # 8. THEME
          # ==========================================

          theme = VALUES / "flux_theme.xml"

          theme.write_text(
          """<?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="FluxTheme" parent="AppTheme">

                  <item name="colorPrimary">@color/flux_purple</item>

                  <item name="colorPrimaryDark">@color/flux_purple_dark</item>

                  <item name="colorAccent">@color/flux_purple_light</item>

                  <item name="android:colorAccent">@color/flux_purple_light</item>

                  <item name="android:windowBackground">@color/flux_background</item>

                  <item name="android:statusBarColor">@color/flux_purple_dark</item>

                  <item name="android:navigationBarColor">@color/flux_background</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          """,
          encoding="utf-8"
          )

          # ==========================================
          # 9. ENABLE THEME
          # ==========================================

          manifest = MAIN / "AndroidManifest.xml"

          if manifest.exists():

              text = manifest.read_text(
                  encoding="utf-8"
              )

              text = text.replace(
                  'android:theme="@style/AppTheme"',
                  'android:theme="@style/FluxTheme"'
              )

              manifest.write_text(
                  text,
                  encoding="utf-8"
              )

              print(
                  "[OK] FluxTheme enabled"
              )

          # ==========================================
          # 10. FINAL
          # ==========================================

          print("")
          print("======================================")
          print("        FLUXLAUNCHER READY")
          print("======================================")
          print("Name:       FluxLauncher")
          print("Package:    com.fluxlauncher.fv")
          print("Theme:      PURPLE")
          print("Play:       PURPLE")
          print("Discord:    REMOVED")
          print("APK:        FluxLauncher.apk")
          print("======================================")
          print("")

          PY

      # ==========================================
      # GRADLE
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      # ==========================================
      # LANGUAGE LIST
      # ==========================================

      - name: Update language list
        run: |
          chmod +x scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh

      # ==========================================
      # LWJGL
      # ==========================================

      - name: Build LWJGL
        run: |
          ./gradlew :jre_lwjgl3glfw:build --no-daemon

      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build FluxLauncher APK
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      # ==========================================
      # PREPARE APK
      # ==========================================

      - name: Prepare FluxLauncher APK
        shell: bash
        run: |

          mkdir -p out

          APK=$(find \
            app_pojavlauncher/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK NOT FOUND"

            find \
              app_pojavlauncher/build \
              -type f \
              -name "*.apk" \
              -print

            exit 1

          fi

          cp "$APK" out/FluxLauncher.apk

          echo ""
          echo "======================================"
          echo "FluxLauncher.apk CREATED"
          echo "======================================"

          ls -lh out/FluxLauncher.apk

      # ==========================================
      # UPLOAD
      # ==========================================

      - name: Upload FluxLauncher
        uses: actions/upload-artifact@v4
        with:
          name: FluxLauncher
          path: out/FluxLauncher.apk
          if-no-files-found: error
