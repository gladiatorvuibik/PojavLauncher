name: Build FluxLauncher

on:
  workflow_dispatch:
  push:
    branches:
      - v3_openjdk

permissions:
  contents: read

jobs:
  build:
    name: Build FluxLauncher APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download LTW
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          mkdir -p app_pojavlauncher/libs
          wget \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar \
            -O app_pojavlauncher/libs/ltw-release.aar

      # ==============================
      # FLUXLAUNCHER CUSTOMIZATION
      # ==============================
      - name: Apply FluxLauncher customization
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Application ID
          gradle = Path("app_pojavlauncher/build.gradle")

          if gradle.exists():
              text = gradle.read_text()

              text = re.sub(
                  r'applicationId\s+"[^"]+"',
                  'applicationId "FluxLauncher.fv"',
                  text,
                  count=1
              )

              text = re.sub(
                  r'^\s*applicationIdSuffix\s+[\'"][^\'"]+[\'"]\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              gradle.write_text(text)

          # Название приложения
          strings = Path(
              "app_pojavlauncher/src/main/res/values/strings.xml"
          )

          if strings.exists():
              text = strings.read_text()

              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">FluxLauncher</string>',
                  text,
                  count=1
              )

              strings.write_text(text)

          # ==============================
          # ФИОЛЕТОВЫЕ ЦВЕТА
          # ==============================

          values = Path(
              "app_pojavlauncher/src/main/res/values"
          )

          values.mkdir(parents=True, exist_ok=True)

          colors = values / "flux_colors.xml"

          colors.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>

              <color name="flux_purple">#9C27B0</color>
              <color name="flux_purple_dark">#6A1B9A</color>
              <color name="flux_purple_light">#CE93D8</color>

              <color name="flux_background">#120A18</color>
              <color name="flux_surface">#1E0A29</color>

              <color name="flux_text">#FFFFFF</color>
              <color name="flux_text_secondary">#D8B8E6</color>

          </resources>
          """)

          # ==============================
          # ФИОЛЕТОВАЯ ТЕМА
          # ==============================

          theme = values / "flux_theme.xml"

          theme.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="FluxTheme" parent="AppTheme">

                  <item name="colorPrimary">@color/flux_purple</item>
                  <item name="colorPrimaryDark">@color/flux_purple_dark</item>
                  <item name="colorAccent">@color/flux_purple_light</item>

                  <item name="android:windowBackground">@color/flux_background</item>

                  <item name="android:statusBarColor">@color/flux_purple_dark</item>

                  <item name="android:navigationBarColor">@color/flux_background</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          """)

          # ==============================
          # ПОДКЛЮЧАЕМ ФИОЛЕТОВУЮ ТЕМУ
          # ==============================

          manifest = Path(
              "app_pojavlauncher/src/main/AndroidManifest.xml"
          )

          if manifest.exists():
              text = manifest.read_text()

              text = text.replace(
                  'android:theme="@style/AppTheme"',
                  'android:theme="@style/FluxTheme"'
              )

              manifest.write_text(text)

          print("FluxLauncher customization applied")
          print("Purple interface enabled")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Update language list
        run: |
          chmod +x scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh

      - name: Build LWJGL
        run: |
          ./gradlew :jre_lwjgl3glfw:build --no-daemon

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build FluxLauncher
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p out

          APK=$(find app_pojavlauncher/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          cp "$APK" out/FluxLauncher.apk

          ls -lh out/FluxLauncher.apk

      - name: Upload FluxLauncher APK
        uses: actions/upload-artifact@v4
        with:
          name: FluxLauncher
          path: out/FluxLauncher.apk
          if-no-files-found: error
